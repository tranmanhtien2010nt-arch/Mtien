<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OwO – Thẻ ghi nhớ miễn phí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F1F5FB;--surf:#fff;--ink:#0F1729;--mut:#5A6A88;--pri:#0F1729;--pi:#fff;--acc:#F2B33D;--bad:#C2452D;--good:#1F8A5B;--line:#D5DDEC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1729;--surf:#18223A;--ink:#EAF0FA;--mut:#93A1BD;--pri:#EAF0FA;--pi:#0F1729;--bad:#F08A72;--good:#4CC38A;--line:#2A3858}}
:root[data-theme="dark"]{--bg:#0F1729;--surf:#18223A;--ink:#EAF0FA;--mut:#93A1BD;--pri:#EAF0FA;--pi:#0F1729;--bad:#F08A72;--good:#4CC38A;--line:#2A3858}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Inter,system-ui,Roboto,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 4px;font-weight:700}
p{margin:0}.mut{color:var(--mut)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);padding:11px 20px;border-radius:999px;font-weight:600}
button:hover{border-color:var(--pri)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.p{background:var(--pri);color:var(--pi);border-color:var(--pri);font-weight:700}
button.g{border-color:transparent;background:none;color:var(--mut);padding:8px 10px}
.set{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;cursor:pointer}
.set:hover{border-color:var(--pri)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.modes button{padding:16px;text-align:left;font-weight:700}.modes small{display:block;font-weight:400;color:var(--mut)}
.term{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.fc{perspective:1000px;margin:22px 0}
.card{min-height:280px;background:var(--surf);border:1.5px solid var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:26px;font-weight:700;cursor:pointer;position:relative;transition:transform .25s}
.card.back{background:var(--pri);color:var(--pi);border-color:var(--pri);font-weight:500}
.card small{position:absolute;top:12px;left:16px;font-size:13px;font-weight:500;opacity:.7}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px}
.opt.ok{background:var(--good);border-color:var(--good);color:#fff}.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.q{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:24px;font-size:22px;font-weight:700;margin:16px 0}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink)}
textarea{min-height:260px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tile{min-height:84px;padding:8px;font-size:15px;display:flex;align-items:center;justify-content:center;text-align:center}
.tile.sel{border-color:var(--acc);background:var(--acc);color:#102B2F}.tile.gone{visibility:hidden}.tile.bad{border-color:var(--bad)}
.ed{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}.ed label{display:block;color:var(--mut);font-size:13px;font-weight:700;margin:12px 0 4px}.ed textarea{min-height:64px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ai{position:relative}.ai button{position:absolute;right:8px;bottom:12px;padding:6px 10px}.tag{font-size:13px;color:var(--mut)}.fab{position:fixed;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;border-radius:999px 0 0 999px;padding:12px 20px;background:#fff;color:#0F1729;border-color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35)}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surf);border:1.5px solid var(--line);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto}.sheet p{margin-top:4px}
main{padding-bottom:110px}#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:4}#nav:empty{display:none}#nav button{flex:1;border:0;border-radius:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);padding:8px 0}#nav button span{font-size:20px;line-height:1}#nav button.on{color:var(--ink)}
.lvr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.lvr b{margin-left:auto}.lvr i{width:10px;height:10px;border-radius:50%;flex:none}.lvr input{width:20px;height:20px}
select{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}.opt,.tile{border-radius:16px}.logo{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--acc);color:#0F1729;font-weight:800;font-size:15px;letter-spacing:-.03em;flex:none}
.big{font-size:40px;font-weight:800}
@media(max-width:520px){.term{grid-template-columns:1fr}.card{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.lkc{margin-top:14px;background:var(--bg);padding:14px;border-radius:12px;border:1.5px solid var(--line)}.lkt{font-size:22px}.src{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}.pos{margin-top:12px;font-weight:700;color:var(--mut);font-size:13px}.vi{margin-top:2px;font-size:18px;font-weight:600}.note{margin-top:8px;font-size:14px;color:var(--mut)}.ex{margin-top:8px;padding-left:10px;border-left:3px solid var(--acc);font-size:15px}.kw{font-weight:800;color:var(--ink);background:rgba(242,179,61,.35);border-radius:3px;padding:0 2px}.chs{margin-top:10px;font-size:14px}.chip{padding:3px 11px;margin:3px 4px 0 0;font-size:13px;font-weight:600}.pack{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sn{margin-top:3px;font-size:16px}.cm{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:grid;place-items:center;padding:12px}.cm>div{background:var(--surf);color:var(--ink);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto}.cm label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
.dueb{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:18px;padding:16px 18px;margin-top:14px;background:var(--pri);color:var(--pi);border-color:var(--pri)}.dueb b{font-size:36px;line-height:1}.dueb span{font-weight:700}.dueb small{font-weight:500;opacity:.8}
.srsg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.srsg button{padding:10px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px}.srsg small{font-weight:500;color:var(--mut);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:var(--surf);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:19px}.stat small{color:var(--mut);font-size:11px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}.hm i{aspect-ratio:1;border-radius:6px;background:var(--line);font-size:10px;font-style:normal;display:grid;place-items:center;color:var(--mut)}
.stg{display:flex;gap:6px;margin:12px 0}.stg span{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:999px;border:1.5px solid var(--line);color:var(--mut)}.stg .on{background:var(--pri);color:var(--pi);border-color:var(--pri);font-weight:700}.stg .dn{background:var(--good);color:#fff;border-color:var(--good)}
.cz{font-size:19px;line-height:1.6}.msk{font-size:26px;letter-spacing:.1em;font-weight:700;text-align:center;margin:12px 0;font-family:ui-monospace,Menlo,monospace}
</style>
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OwO"><meta name="application-name" content="OwO">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html{background:#000}img.logo{display:block;background:#000;object-fit:cover}
#sp{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .8s ease,visibility .8s}
#sp.out{opacity:0;visibility:hidden;pointer-events:none}
#sp img{width:min(58vw,300px);height:auto;opacity:0;filter:blur(14px);transform:scale(.9);animation:spIn 1.2s cubic-bezier(.22,.8,.24,1) .15s forwards}
#sp p{margin:0;color:#fff;font:500 13px/1.4 Inter,system-ui,sans-serif;letter-spacing:.1em;opacity:0;transform:translateY(6px);animation:spUp .9s ease .8s forwards}
#sp i{position:absolute;bottom:calc(52px + env(safe-area-inset-bottom,0px));width:44px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
#sp i::after{content:"";display:block;height:100%;background:#fff;transform:translateX(-100%);animation:spBar 1.7s ease-in-out .3s forwards}
@keyframes spIn{to{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes spUp{to{opacity:.55;transform:none}}@keyframes spBar{to{transform:translateX(0)}}
#app{opacity:0}body.rdy #app{opacity:1;animation:appIn .9s cubic-bezier(.22,.8,.24,1) backwards}
@keyframes appIn{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){#sp img,#sp p{animation-duration:.01s;animation-delay:0s;filter:none}#sp i{display:none}body.rdy #app{animation:none}}
</style><noscript><style>#app{opacity:1}#sp{display:none}</style></noscript>
</head>
